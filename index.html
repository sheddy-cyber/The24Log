<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#111c31" />
    <meta name="description" content="A personal 24-hour time ledger." />
    
    <!-- PWA & Apple Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="24 Log" />
    
    <!-- Icons & Manifest -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg?v=400" />
    <link rel="alternate icon" type="image/png" href="/icon-192.png?v=400" />
    <link rel="shortcut icon" href="/favicon.ico?v=400" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=400" />
    <link rel="manifest" href="/manifest.webmanifest?v=400" />
    
    <link rel="stylesheet" href="/src/style.css?v=400" />
    <title>The 24 Log — own your hours</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js?v=400"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('PWA Service Worker registered:', reg.scope))
            .catch(err => console.error('PWA Service Worker registration failed:', err));
        });
      }
    </script>
  </body>
</html>
