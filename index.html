<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f3ea" />
    <meta name="description" content="A private 24-hour time ledger. Log what each hour went to and see the pattern." />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="24 Log" />

    <link rel="icon" type="image/svg+xml" href="/icon.svg?v=600" />
    <link rel="apple-touch-icon" href="/icon.svg?v=600" />
    <link rel="manifest" href="/manifest.webmanifest?v=600" />

    <!-- Set theme and heading typeface before first paint, and start loading
         only the one display face in use. DM Sans + DM Mono are always needed. -->
    <script>
      (function () {
        var fonts = {
          "lobster-two": "Lobster+Two:ital,wght@0,400;0,700;1,400",
          raleway: "Raleway:wght@500;600;700",
          "libre-baskerville": "Libre+Baskerville:ital,wght@0,400;0,700;1,400",
        };
        var s = {};
        try {
          s = (JSON.parse(localStorage.getItem("the24log:v1")) || {}).settings || {};
        } catch (e) {}
        var theme = s.theme || (s.darkMode === true ? "dark" : "light");
        if (theme === "system") theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        var font = fonts[s.displayFont] ? s.displayFont : "lobster-two";
        var root = document.documentElement;
        root.dataset.theme = theme;
        root.dataset.font = font;
        root.dataset.cards = s.cardStyle === "solid" ? "solid" : "glass";
        var h = new Date().getHours();
        root.dataset.daypart = h < 6 ? "night" : h < 12 ? "morning" : h < 18 ? "afternoon" : "evening";
        document.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "#0c1220" : "#f7f3ea";
        var link = document.createElement("link");
        link.id = "font-" + font;
        link.rel = "stylesheet";
        link.href = "https://fonts.googleapis.com/css2?family=" + fonts[font] + "&display=swap";
        document.head.appendChild(link);
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400&display=swap"
    />

    <link rel="stylesheet" href="/src/style.css?v=1008" />
    <title>The 24 Log</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js?v=1008"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/sw.js").catch(function () {});
        });
      }
    </script>
  </body>
</html>
